<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Vocal de motivation — Ecom Africa</title>
<style>
  :root {
    --primary: #0042DA;
    --primary-dark: #0033a8;
    --accent: #FF8E21;
    --danger: #E11D48;
    --bg: #F7F8FF;
    --text: #303235;
    --muted: #6B7280;
    --border: #E2E8F0;
    --success: #16A34A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Open Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 24px;
    width: 100%;
    max-width: 480px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    text-align: center;
  }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p.hint { color: var(--muted); font-size: 14px; margin: 0 0 20px; }
  .timer {
    font-size: 36px;
    font-weight: 600;
    margin: 16px 0;
    font-variant-numeric: tabular-nums;
  }
  .timer.recording { color: var(--danger); }
  button {
    border: 0;
    border-radius: 999px;
    padding: 14px 24px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s, background 0.2s;
    margin: 4px;
  }
  button:active { transform: scale(0.96); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: var(--primary-dark); }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-secondary { background: var(--border); color: var(--text); }
  .btn-success { background: var(--success); color: #fff; }
  .meter {
    height: 8px;
    background: var(--border);
    border-radius: 4px;
    overflow: hidden;
    margin: 12px 0;
  }
  .meter-bar {
    height: 100%;
    background: linear-gradient(to right, var(--success), var(--accent), var(--danger));
    width: 0%;
    transition: width 0.05s;
  }
  .result {
    background: var(--bg);
    padding: 12px;
    border-radius: 8px;
    font-size: 12px;
    margin-top: 12px;
    word-break: break-all;
    color: var(--muted);
    text-align: left;
  }
  .status {
    font-size: 13px;
    color: var(--muted);
    margin-top: 12px;
  }
  .error {
    background: #FEE2E2;
    color: #991B1B;
    padding: 12px;
    border-radius: 8px;
    font-size: 14px;
    margin-top: 12px;
  }
  audio { width: 100%; margin-top: 12px; }
  .countdown {
    color: var(--muted);
    font-size: 13px;
    margin-top: 4px;
  }
  .countdown.too-short { color: var(--danger); font-weight: 600; }
</style>
</head>
<body>
<div class="card">
  <h1>🎙️ Enregistre ton vocal de motivation</h1>
  <p class="hint">30 secondes minimum. Sois honnête et naturel(le).</p>

  <div class="timer" id="timer">00:00</div>
  <div class="countdown" id="countdown">Min. 30 secondes</div>
  <div class="meter"><div class="meter-bar" id="meter"></div></div>

  <div id="controls">
    <button class="btn-primary" id="btn-start">🎙️ Commencer</button>
    <button class="btn-danger" id="btn-stop" style="display:none">⏹ Arrêter</button>
    <button class="btn-secondary" id="btn-redo" style="display:none">🔄 Recommencer</button>
    <button class="btn-success" id="btn-send" style="display:none">📤 Envoyer</button>
  </div>

  <audio id="preview" controls style="display:none"></audio>

  <div id="status" class="status"></div>
  <div id="error" class="error" style="display:none"></div>
  <div id="result" class="result" style="display:none"></div>
</div>

<script>
(function () {
  const MIN_DURATION_MS = 30 * 1000;
  const MAX_DURATION_MS = 180 * 1000;
  const UPLOAD_URL = '/api/typebot/vocal/upload';

  const els = {
    timer: document.getElementById('timer'),
    countdown: document.getElementById('countdown'),
    meter: document.getElementById('meter'),
    btnStart: document.getElementById('btn-start'),
    btnStop: document.getElementById('btn-stop'),
    btnRedo: document.getElementById('btn-redo'),
    btnSend: document.getElementById('btn-send'),
    preview: document.getElementById('preview'),
    status: document.getElementById('status'),
    error: document.getElementById('error'),
    result: document.getElementById('result'),
  };

  let mediaRecorder = null;
  let chunks = [];
  let stream = null;
  let startTime = 0;
  let timerInterval = null;
  let blob = null;
  let audioContext = null;
  let analyser = null;
  let meterRAF = null;

  function fmt(ms) {
    const s = Math.floor(ms / 1000);
    return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  }

  function pickMime() {
    const candidates = [
      'audio/webm;codecs=opus',
      'audio/webm',
      'audio/ogg;codecs=opus',
      'audio/mp4',
    ];
    for (const m of candidates) {
      if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) {
        return m;
      }
    }
    return '';
  }

  function showError(msg) {
    els.error.textContent = msg;
    els.error.style.display = 'block';
  }

  function clearError() { els.error.style.display = 'none'; }

  function stopMeter() {
    if (meterRAF) cancelAnimationFrame(meterRAF);
    meterRAF = null;
    if (audioContext) { audioContext.close(); audioContext = null; analyser = null; }
    els.meter.style.width = '0%';
  }

  function startMeter(s) {
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const src = audioContext.createMediaStreamSource(s);
    analyser = audioContext.createAnalyser();
    analyser.fftSize = 512;
    src.connect(analyser);
    const data = new Uint8Array(analyser.frequencyBinCount);
    const tick = () => {
      analyser.getByteFrequencyData(data);
      let sum = 0;
      for (let i = 0; i < data.length; i++) sum += data[i];
      const avg = sum / data.length;
      els.meter.style.width = Math.min(100, (avg / 128) * 100) + '%';
      meterRAF = requestAnimationFrame(tick);
    };
    tick();
  }

  async function startRecording() {
    clearError();
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) {
      showError("Accès au microphone refusé. Active-le dans ton navigateur puis recharge.");
      return;
    }
    chunks = [];
    const mime = pickMime();
    try {
      mediaRecorder = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
    } catch (e) {
      showError("Enregistrement non supporté par ce navigateur.");
      stream.getTracks().forEach((t) => t.stop());
      return;
    }
    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
    mediaRecorder.onstop = onRecordingStopped;
    mediaRecorder.start();
    startTime = Date.now();
    els.timer.classList.add('recording');
    els.btnStart.style.display = 'none';
    els.btnStop.style.display = 'inline-block';
    els.btnRedo.style.display = 'none';
    els.btnSend.style.display = 'none';
    els.preview.style.display = 'none';
    els.result.style.display = 'none';
    els.status.textContent = 'Enregistrement en cours...';
    startMeter(stream);
    timerInterval = setInterval(() => {
      const elapsed = Date.now() - startTime;
      els.timer.textContent = fmt(elapsed);
      if (elapsed < MIN_DURATION_MS) {
        els.countdown.textContent = 'Encore ' + Math.ceil((MIN_DURATION_MS - elapsed) / 1000) + 's minimum';
        els.countdown.classList.add('too-short');
      } else {
        els.countdown.textContent = '✓ Tu peux arrêter quand tu veux';
        els.countdown.classList.remove('too-short');
      }
      if (elapsed >= MAX_DURATION_MS) stopRecording();
    }, 200);
  }

  function stopRecording() {
    if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
    clearInterval(timerInterval);
    stopMeter();
    els.timer.classList.remove('recording');
    if (stream) stream.getTracks().forEach((t) => t.stop());
  }

  function onRecordingStopped() {
    const mime = mediaRecorder.mimeType || 'audio/webm';
    blob = new Blob(chunks, { type: mime });
    const elapsed = Date.now() - startTime;
    if (elapsed < MIN_DURATION_MS) {
      showError("Vocal trop court (" + Math.floor(elapsed / 1000) + 's). Minimum 30 secondes.');
      els.btnStart.style.display = 'inline-block';
      els.btnStop.style.display = 'none';
      blob = null;
      return;
    }
    els.preview.src = URL.createObjectURL(blob);
    els.preview.style.display = 'block';
    els.btnStop.style.display = 'none';
    els.btnRedo.style.display = 'inline-block';
    els.btnSend.style.display = 'inline-block';
    els.status.textContent = 'Écoute-toi puis clique sur "Envoyer".';
  }

  async function sendRecording() {
    if (!blob) return;
    els.btnSend.disabled = true;
    els.btnRedo.disabled = true;
    els.status.textContent = '⏳ Envoi en cours...';
    const fd = new FormData();
    const ext = (blob.type.split('/')[1] || 'webm').split(';')[0];
    fd.append('vocal', blob, 'motivation.' + ext);
    try {
      const res = await fetch(UPLOAD_URL, { method: 'POST', body: fd });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      els.status.textContent = '✅ Vocal envoyé !';
      els.result.innerHTML = '<strong>URL de ton vocal :</strong><br>'
        + '<span id="vocal-url">' + data.url + '</span><br>'
        + '<button class="btn-primary" id="btn-copy" style="margin-top:8px;padding:8px 16px;font-size:13px">📋 Copier l\'URL</button>';
      els.result.style.display = 'block';
      document.getElementById('btn-copy').onclick = () => {
        navigator.clipboard.writeText(data.url).then(() => {
          document.getElementById('btn-copy').textContent = '✓ Copié';
        });
      };
      try {
        window.parent.postMessage({ type: 'typebot-vocal-uploaded', url: data.url }, '*');
      } catch (e) { /* parent might be cross-origin without listener */ }
      els.btnSend.style.display = 'none';
    } catch (e) {
      showError("Échec de l'envoi : " + e.message + '. Réessaie.');
      els.btnSend.disabled = false;
      els.btnRedo.disabled = false;
    }
  }

  function redo() {
    blob = null;
    chunks = [];
    els.preview.style.display = 'none';
    els.result.style.display = 'none';
    els.timer.textContent = '00:00';
    els.countdown.textContent = 'Min. 30 secondes';
    els.countdown.classList.remove('too-short');
    els.status.textContent = '';
    els.btnRedo.style.display = 'none';
    els.btnSend.style.display = 'none';
    els.btnSend.disabled = false;
    els.btnRedo.disabled = false;
    els.btnStart.style.display = 'inline-block';
    clearError();
  }

  els.btnStart.addEventListener('click', startRecording);
  els.btnStop.addEventListener('click', stopRecording);
  els.btnSend.addEventListener('click', sendRecording);
  els.btnRedo.addEventListener('click', redo);

  if (!navigator.mediaDevices || !window.MediaRecorder) {
    showError('Ton navigateur ne supporte pas l\'enregistrement audio. Utilise Chrome ou Safari récent.');
    els.btnStart.disabled = true;
  }
})();
</script>
</body>
</html>
